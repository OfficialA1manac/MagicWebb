name: Audit Checklist

on:
  workflow_dispatch:  # Manual trigger for full audits
  schedule:
    # Weekly audit run: Sunday 04:00 UTC
    - cron: "0 4 * * 0"
  push:
    tags: ["v*"]       # Release tags trigger a full audit

permissions:
  contents: read

jobs:
  # ── Full Solidity audit suite ─────────────────────────────────────────
  contracts-audit:
    name: Contracts — Full Audit Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773 # v1.2.0
      - name: Build (with sizes)
        working-directory: contracts
        run: forge build --sizes

      - name: Run all tests (verbose)
        working-directory: contracts
        run: forge test -vvv

      - name: Run fuzz tests
        working-directory: contracts
        run: |
          forge test --match-path test/AuditFuzz.t.sol -vvv
          forge test --match-path test/OfferBookInvariant.t.sol -vvv
          forge test --match-path test/AuctionHouseInvariant.t.sol -vvv
          forge test --match-path test/MarketplaceInvariant.t.sol -vvv

      - name: Generate coverage report
        working-directory: contracts
        # --ir-minimum is required, not optional: `forge coverage` disables the
        # optimizer and viaIR for accurate source mappings, but these contracts
        # need `via_ir = true` (foundry.toml) to compile at all, so plain
        # `forge coverage` fails with "Stack too deep" and has been failing this
        # job. --ir-minimum re-enables viaIR at minimum optimization, which is
        # Foundry's documented workaround; the trade-off is less precise source
        # mappings, which is acceptable here because the lcov output is only
        # uploaded to Codecov on version tags (see the next step).
        run: forge coverage --ir-minimum --report lcov --report-file lcov.info

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: codecov/codecov-action@5a605bd92782ce0810fa3b8acc235c921b497052 # v5.2.0
        with:
          files: contracts/lcov.info
          flags: contracts
          fail_ci_if_error: false

  # ── Slither static analysis ───────────────────────────────────────────
  slither:
    name: Contracts — Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773 # v1.2.0
      - name: Slither static analysis (full)
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high
          slither-args: --print human-summary

  # ── Backend audit suite ───────────────────────────────────────────────
  backend-audit:
    name: Backend — Full Audit Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Vulncheck (Go dependency CVEs)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test (race detector)
        working-directory: backend
        run: go test -race -count=1 ./...

      - name: Staticcheck
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  # ── Secret scan (gitleaks) ────────────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0

      - name: gitleaks
        # See ci.yml: the old pin was not a real commit and no v2.5.0 exists.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Same as ci.yml: the action looks the repo owner up through the
          # GitHub API to decide whether a license is required; anonymous on
          # the runner's shared IP it 403s and fails with "missing gitleaks
          # license" (2026-09-07 nightly). A token makes the call authenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Audit summary ─────────────────────────────────────────────────────
  audit-summary:
    name: Audit Summary
    needs: [contracts-audit, slither, backend-audit, secrets]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Compile audit results
        run: |
          echo "## 🔍 Full Audit Checklist Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts — Build & Sizes | ${{ needs.contracts-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts — Unit Tests | ${{ needs.contracts-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts — Fuzz Tests | ${{ needs.contracts-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts — Coverage Report | ${{ needs.contracts-audit.result == 'success' && '✅ Generated' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Slither — Static Analysis | ${{ needs.slither.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend — Build | ${{ needs.backend-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend — go vet | ${{ needs.backend-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend — Vulncheck (Go dep CVEs) | ${{ needs.backend-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend — Race Tests | ${{ needs.backend-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend — Staticcheck | ${{ needs.backend-audit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets — Gitleaks | ${{ needs.secrets.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
