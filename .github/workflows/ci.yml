name: CI

on:
  push:
    branches: [main]
    # Phase 5 V5.1: release-tag trigger — runs the FULL suite (Foundry + Slither)
    # on version tags (v*). Normal pushes/PRs skip Foundry/Slither for speed;
    # a release tag gate guarantees those pass before any release.
    tags: ["v*"]
  pull_request:
    branches: [main]

# v35: explicit least-privilege permissions — only contents:read needed
# for checkout; drops the default write scope on GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      # v35: pinned to full semver tags (immutable git references) instead
      # of mutable major-version tags (@v4).
      - uses: actions/checkout@v4.2.0
      # ── Disk space recovery ──────────────────────────────────────────────────
      # GitHub-hosted runners start with ~29 GB free but can drop below 1 GB
      # after checkout + tool downloads. Go's test cache, module cache, and
      # build artifacts can exhaust the remaining space mid-run, producing
      # cryptic ENOSPC (no space left on device) failures. The cleanup below
      # frees ~30+ GB by removing pre-installed toolchains (.NET, Android,
      # Haskell, Swift, etc.) and Docker images we never use. Hazard: if
      # Go's module cache was previously populated, `go clean -modcache`
      # purges it — the next `go build` re-downloads modules, but this is
      # cheaper than an ENOSPC crash mid-pipeline.
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/julia
          sudo docker image prune -af || true
          echo "=== After cleanup ==="
          df -h /
      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install Zig
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          sudo ln -sf /usr/local/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig
          zig version
      - name: Compile Zig libraries (zigmedia)
        run: |
          cd backend/zigsha256 && zig build-lib -O ReleaseFast -dynamic zigsha256.zig && \
          cd ../zigcrypto && zig build-lib -O ReleaseFast -dynamic zigcrypto.zig && \
          cd ../zigsniff && zig build-lib -O ReleaseFast -dynamic zignsniff.zig
      - name: Test Zig libraries (ZIG-4)
        run: |
          cd backend/zigsha256 && zig test zigsha256.zig && \
          cd ../zigcrypto && zig test zigcrypto.zig && \
          cd ../zigsniff && zig test zignsniff.zig && \
          echo "All Zig tests passed"
      - name: Build (zigmedia)
        working-directory: backend
        run: CGO_ENABLED=1 go build -tags zigmedia ./...
      - name: Vet (zigmedia)
        working-directory: backend
        run: CGO_ENABLED=1 go vet -tags zigmedia ./...
      - name: Vulncheck (Go dependency CVEs)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # The Zig libraries are built as shared objects, and cgo does not embed
      # an rpath pointing at them. Building and vetting only need them at link
      # time, but `go test` *runs* the binaries, so the loader has to find
      # libzigsha256.so / libzigcrypto.so / libzignsniff.so or every package
      # dies before main with "cannot open shared object file". The production
      # image sidesteps this by copying the .so files into /usr/lib (see
      # Dockerfile); CI resolves them in place instead.
      - name: Test (zigmedia)
        working-directory: backend
        run: |
          export LD_LIBRARY_PATH="$PWD/zigsha256:$PWD/zigcrypto:$PWD/zigsniff:$LD_LIBRARY_PATH"
          CGO_ENABLED=1 go test -tags zigmedia ./...

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vvv

  slither:
    name: Contracts (Slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high

  frontend-lint:
    name: Frontend (Astro check + vitest + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.0
      - name: No .test.* files in pages/
        run: |
          bad=$(find app/src/pages -maxdepth 1 -name '*.test.*' 2>/dev/null)
          if [ -n "$bad" ]; then
            echo "ERROR: .test.* files found in app/src/pages/ — Astro would render them as routes:"
            echo "$bad" | sed 's/^/  /'
            echo "Move them to app/src/__tests__/ instead."
            exit 1
          fi
          echo "OK — no .test.* files in app/src/pages/"
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps
      - name: Astro check (typecheck)
        working-directory: app
        run: npx astro check
      # The github-actions reporter turns each failed assertion into a check
      # annotation, so failures are visible on the PR and through the public
      # check-runs API instead of being buried in a log that needs an
      # authenticated download. Without it a red run reports only "Process
      # completed with exit code 1".
      # The github-actions reporter only annotates assertion failures — if
      # Vitest dies during startup it never loads, and the job reports nothing
      # but "Process completed with exit code 1". Echoing the tail of the
      # output as an ::error makes startup crashes visible too. Newlines are
      # percent-encoded because workflow commands are single-line.
      - name: Vitest (unit tests)
        working-directory: app
        run: |
          set -o pipefail
          if npx vitest run --reporter=default --reporter=github-actions 2>&1 | tee /tmp/vitest.log; then
            exit 0
          fi
          echo "::error title=Vitest failed::$(tail -c 3000 /tmp/vitest.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          exit 1

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned to the v2.3.9 tag commit. The previous pin
        # (4af6123da341504d1141b584faae0815802f5149, commented "v2.5.0") is not
        # a commit in this repository and no v2.5.0 tag was ever published —
        # the newest v2 is v2.3.9. GitHub resolves action references during
        # "Set up job", so an unresolvable SHA failed the job before a single
        # step ran, which is exactly how this presented.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # The action looks the repo owner up through the GitHub API to decide
          # whether a license is required (personal accounts are exempt).
          # Without a token that call is anonymous and shares the runner's IP
          # rate limit; when it 403s the action gives up and fails with
          # "missing gitleaks license" even though this account needs none.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
