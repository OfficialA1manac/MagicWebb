# ── Auto-deploy on push to main ──────────────────────────────────────────────
#
# Flow:  push to main  →  make test (Go race) + frontend (astro check, vitest, guard)
#                      →  build ONCE: fly deploy --build-only --push  →  one image ref
#                      →  per-network legs: fly deploy --image <ref> --strategy rolling
#                                           └─ smoke check /readyz, then the SHA sync gate
#
# Why a separate workflow instead of extending `ci.yml`:
#   * The existing `ci.yml` runs 4 jobs in parallel on PR + push (backend,
#     contracts/Foundry, slither, gitleaks). Adding a deploy job there
#     would force Foundry tests on every push, adding ≈5–10 min to the
#     go-to-green gate. Foundry is slow and the user-visible deploy
#     latency should be tight.
#   * A dedicated `deploy.yml` keeps the deploy gate short and cheap
#     (just `make test`), and the broader CI runs concurrently from
#     the same push event — both run on a push, neither blocks the
#     other.
#
# Why `make test` only (not Foundry) + frontend gate:
#   The deploy gate now runs `make test` (Go race detector) AND the frontend
#   checks (astro check, vitest, .test.* guard). Foundry contracts tests
#   (slow, flaky on Foundry cache misses) live in CI's contracts job, not
#   here. The frontend checks add ~1-2 minutes but catch Astro type errors,
#   broken vitest suites, and stale test files in pages/ before deploy.
#
# Concurrency: `cancel-in-progress: false` queues any commit pushed
# while a previous deploy is still rolling — at most ONE release is in
# flight per branch at any time. This protects the single-machine
# `min_machines_running = 1` deployment from a race where two deploys
# try to replace the machine simultaneously.
#
# Permissions: each job declares `permissions: { contents: read }`,
# the minimum needed for `actions/checkout`. This drops the default
# write scope on `GITHUB_TOKEN` (OpenSSF Scorecard "least-privilege").
# FLY_API_TOKEN is the only deploy-scope credential — it is scoped to
# a single deploy step (not the job) so a future step that accidentally
# logs `$GITHUB_ENV` cannot leak it.
#
# flyctl install: the canonical `superfly/flyctl-actions` third-party
# action ships without semver tags that would survive a breaking
# release, so we install flyctl directly from https://fly.io/install.sh
# (the same curl-pipe-sh one-liner used in the official Fly docs).
# This drops the third-party-action supply-chain dependency entirely.
#
# Secrets required (GitHub → Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN      — Fly API token with deploy scope.
#                        Create once with:  fly tokens create deploy
#   REOWN_PROJECT_ID   — WalletConnect/Reown project ID from cloud.reown.com
#   WC_PROJECT_ID      — same id, injected into fly.toml [env] for the runtime
#
# Repository variables (GitHub → Settings → Secrets and variables → Actions → Variables):
#   COSTON2_ENABLED    — default true.  } One Fly app per network; a network
#   SONGBIRD_ENABLED   — default false. } deploys when its flag is "true".
#   FLARE_ENABLED      — default false. } Enable only after the Fly app, Neon
#                                         project and secrets for it exist.
#
# Everything else a deploy needs (contract addresses, tracked collections,
# index start block, RPC set, Fly app name, public origin) is read from
# deployments/<network>.json — the repository's single source of truth —
# so there is nothing per-network to maintain in GitHub settings. A network
# whose record says "not-deployed" boots in read-only mode (UI + API, no
# indexer) until its addresses are filled in.
#
# CHAIN_ID, RPC_URL, RPC_URLS, SIWE_DOMAIN and FRONTEND_URL are properties of
# the network and live in the per-network template. Point an app at a
# private RPC provider with `fly secrets set RPC_URL=<url>`, which overrides
# the [env] value at runtime without putting the URL in a public repo.
#
# fly.toml is generated in CI from the selected template + the above
# vars/secrets. fly.toml itself is gitignored — never commit real
# deployment config.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy (push to main)

on:
  push:
    branches: [main]
    # v* tags exist solely to run the tag-gated `verify` job (FlareScan
    # source verification). They never deploy: `plan` requires
    # github.ref == 'refs/heads/main', which excludes all tag refs, and
    # `deploy` needs `plan`. Without this trigger the verify job's
    # startsWith(github.ref, 'refs/tags/v') condition could never be true.
    tags: ["v*"]
  # Manual re-deploy after flipping <NETWORK>_ENABLED repo variables or
  # rotating secrets — no empty commit needed.
  workflow_dispatch:

# Repo-wide default: deny everything except contents:read. Each job
# can request additional permissions if needed; both jobs in this
# workflow only need contents:read.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: make test (Go race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install Zig
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          sudo ln -sf /usr/local/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig
          zig version
      - name: Compile Zig libraries (zigmedia)
        run: |
          cd backend/zigsha256 && zig build-lib -O ReleaseFast -dynamic zigsha256.zig && \
          cd ../zigcrypto && zig build-lib -O ReleaseFast -dynamic zigcrypto.zig && \
          cd ../zigsniff && zig build-lib -O ReleaseFast -dynamic zignsniff.zig
      # cgo embeds no rpath for the Zig shared objects, so the test binaries
      # cannot find libzigsha256.so / libzigcrypto.so / libzignsniff.so at
      # run time and every package dies before main. Same fix as the CI
      # workflow's Test (zigmedia) step; the production image instead copies
      # the .so files into /usr/lib (see Dockerfile).
      - name: Test (zigmedia, race detector)
        run: |
          cd backend
          export LD_LIBRARY_PATH="$PWD/zigsha256:$PWD/zigcrypto:$PWD/zigsniff:$LD_LIBRARY_PATH"
          CGO_ENABLED=1 go test -tags zigmedia ./... -race -count=1 -timeout 120s

  frontend-lint:
    name: Frontend (Astro check + vitest + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.0
      - name: No .test.* files in pages/
        run: |
          bad=$(find app/src/pages -maxdepth 1 -name '*.test.*' 2>/dev/null)
          if [ -n "$bad" ]; then
            echo "ERROR: .test.* files found in app/src/pages/ — Astro would render them as routes:"
            echo "$bad" | sed 's/^/  /'
            echo "Move them to app/src/__tests__/ instead."
            exit 1
          fi
          echo "OK — no .test.* files in app/src/pages/"
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps
      - name: Astro check (typecheck)
        working-directory: app
        run: npx astro check
      - name: Vitest (unit tests)
        working-directory: app
        run: npx vitest run


  verify:
    name: Forge verify (FlareScan source verification)
    needs: [test, frontend-lint]
    # Only run on release tags (v*), not on every push to main. FlareScan
    # has API rate limits and flatten+verify takes ~5 minutes — running it
    # on every deploy would waste API tokens and CI time. Release-tag-only
    # ensures verified source is always published alongside a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.2.0

      - name: Flatten + verify each contract on FlareScan
        # Verifies deployed contracts on FlareScan (blockscout) using forge
        # verify-contract. Addresses and chain ID come from
        # deployments/<network>.json — the repo's single source of truth —
        # never from repository variables, so a tag can only verify what the
        # repo says is deployed.
        #
        # EXPLORER_API_KEY is a GitHub Actions secret. FlareScan requires
        # an API key obtained from https://coston2-explorer.flare.network/.
        working-directory: contracts
        env:
          EXPLORER_API_KEY: ${{ secrets.EXPLORER_API_KEY }}
        run: |
          set -euo pipefail
          # v3.4: verify EVERY network whose manifest says "deployed" — the
          # old single-vars.NETWORK form silently skipped Songbird/Flare.
          for NETWORK in coston2 songbird flare; do
            DEP="../deployments/${NETWORK}.json"
            [ -f "$DEP" ] || { echo "::error::no deployments/${NETWORK}.json"; exit 1; }
            if [ "$(jq -r .status "$DEP")" != "deployed" ]; then
              echo "${NETWORK}: status != deployed; nothing to verify."
              continue
            fi
            CHAIN_ID=$(jq -r .chainId "$DEP")
            EXPLORER_URL=$(jq -r .explorer "$DEP")
            echo "=== ${NETWORK}: verifying on $EXPLORER_URL (chain $CHAIN_ID) ==="

            verify() {
              local name="$1" key="$2" file="$3"
              local addr; addr=$(jq -r ".contracts.${key}" "$DEP")
              echo "--- Verifying $name at $addr ---"
              forge flatten "src/$file" -o "/tmp/${name}_flat.sol"
              forge verify-contract               "$addr"               "src/$file"               --chain "$CHAIN_ID"               --verifier blockscout               --verifier-url "${EXPLORER_URL}/api/"               --etherscan-api-key "$EXPLORER_API_KEY"               --watch || echo "⚠  $name verification skipped or failed (check explorer)"
            }

            # The NFT at contracts.nft is a third-party/test collection, not a
            # contract in this repo (src/MagicWebbNFT.sol was removed in 3867c0c).
            # v3.4: the manager is UNPROXIED — this verifies its real bytecode
            # directly; the three cores are ERC1967 proxies (impls are logged
            # in the deploy broadcast and can be verified manually if wanted).
            verify "MarketplaceManager" "marketplaceManager" "MarketplaceManager.sol"
            verify "Marketplace"       "marketplace"        "Marketplace.sol"
            verify "AuctionHouse"      "auctionHouse"       "AuctionHouse.sol"
            verify "OfferBook"         "offerBook"          "OfferBook.sol"
          done

  plan:
    name: Which networks deploy
    needs: [test, frontend-lint]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      networks: ${{ steps.pick.outputs.networks }}
    steps:
      - uses: actions/checkout@v4.2.0
      - name: Pick enabled networks
        # One Fly app per network. A network deploys when its repository
        # variable <NET>_ENABLED is "true" (COSTON2_ENABLED defaults to true
        # for the network that has always deployed). Everything else a deploy
        # needs — addresses, tracked collections, index start block, RPCs,
        # Fly app name — comes from deployments/<network>.json, the single
        # source of truth, so there is nothing per-network to keep in sync in
        # GitHub settings. A network whose JSON says "not-deployed" boots in
        # read-only mode (UI + API, no indexer) — enable it only once its app,
        # Neon project and secrets exist.
        id: pick
        env:
          COSTON2_ENABLED: ${{ vars.COSTON2_ENABLED }}
          SONGBIRD_ENABLED: ${{ vars.SONGBIRD_ENABLED }}
          FLARE_ENABLED: ${{ vars.FLARE_ENABLED }}
        run: |
          set -euo pipefail
          nets=()
          [ "${COSTON2_ENABLED:-true}" = "true" ] && nets+=("coston2")
          [ "${SONGBIRD_ENABLED:-false}" = "true" ] && nets+=("songbird")
          [ "${FLARE_ENABLED:-false}" = "true" ] && nets+=("flare")
          if [ ${#nets[@]} -eq 0 ]; then echo "::error::no network enabled (COSTON2_ENABLED/SONGBIRD_ENABLED/FLARE_ENABLED)"; exit 1; fi
          json=$(printf '%s\n' "${nets[@]}" | jq -R . | jq -cs .)
          echo "networks=$json" >> "$GITHUB_OUTPUT"
          echo "deploying: $json"

  # ───────────────────────────────────────────────────────────────────────────
  # Build the image ONCE, for every network.
  #
  # Every network runs byte-identical application code. Nothing network-specific
  # can reach the image: the Dockerfile declares a single ARG (REOWN_PROJECT_ID,
  # shared by all three apps) and COPYs only app/ and backend/ — never
  # deployments/, contracts/, or fly.toml. The Astro bundle is network-agnostic
  # by design: backend/cmd/server/ui.go injects window.MW_CHAIN_ID /
  # MW_MARKETPLACE / MW_NETWORK_URLS into every HTML response from the runtime
  # config, and app/src/lib/chains.ts prefers those over its PUBLIC_* build-time
  # fallbacks ("one Astro build serves every network").
  #
  # Building once instead of three times:
  #   * touches a Fly builder ONCE, so a builder outage has one third the
  #     surface (see the retry below for why that matters);
  #   * removes a real drift risk — the Dockerfile uses `npm install
  #     --legacy-peer-deps` (not `npm ci`) and curls the Zig tarball at build
  #     time, so three builds of one commit are not guaranteed identical;
  #   * makes deploy-leg concurrency a non-question: image-only legs cannot
  #     contend on a builder.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build image (once, for all networks)
    needs: [plan]
    runs-on: ubuntu-latest
    # 3 bounded build attempts plus checkout/install overhead.
    timeout-minutes: 45
    outputs:
      image: ${{ steps.fly_build.outputs.image }}
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.fly/bin/"* 2>/dev/null || true
          if ! "$HOME/.fly/bin/flyctl" version; then
            echo "::error title=flyctl install failed::flyctl is not executable after install.sh"
            exit 1
          fi
      - name: Stamp build SHA into Go source
        # A generated Go file the remote builder cannot ignore; its init()
        # sets MWServerBuildSHA, which /healthz echoes as X-MW-Build-SHA and
        # tools/check-fly-sync.sh compares against origin/main. Stamped here
        # rather than per-leg because the image is now shared — all three
        # networks advertise this one SHA, which is exactly what the gate wants.
        run: |
          echo "package api; func init() { MWServerBuildSHA = \"$GITHUB_SHA\" }" > backend/internal/api/build_sha_gen.go
      - name: Minimal fly.toml for the build
        # `--build-only` needs only an app to own the registry repo and a
        # Dockerfile path. The [env] block is runtime config and is generated
        # per-network in the deploy legs below, so deliberately not set here —
        # duplicating it would imply the image depends on it, which is the
        # confusion this job exists to end.
        run: |
          set -euo pipefail
          printf 'app = "magicwebb"\nprimary_region = "sin"\n\n[build]\n  dockerfile = "Dockerfile"\n' > fly.toml
          cat fly.toml
      - name: Build and push image
        id: fly_build
        # Bounded retry. On 2026-08-30 (run 33355471009) two legs died on
        # `Waiting for depot builder... / error releasing builder:
        # deadline_exceeded / failed to list workers: transport:
        # authentication handshake failed: EOF` — Fly's depot builder was
        # simply unavailable, twice per leg, ~5 minutes each. It is transient
        # infrastructure, so retry; the last attempt drops to Fly's legacy
        # remote builder, which is a different backend and survives a depot
        # outage.
        timeout-minutes: 40
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -o pipefail
          IMAGE="registry.fly.io/magicwebb:sha-${GITHUB_SHA}"
          for attempt in 1 2 3; do
            extra=""
            if [ "$attempt" -eq 3 ]; then
              extra="--depot=false"
              echo "::warning title=depot fallback::attempt 3 builds on Fly's legacy remote builder (--depot=false)"
            fi
            echo "── build attempt ${attempt}/3 ${extra}"
            if flyctl deploy --build-only --push --remote-only $extra \
                 --image-label "sha-${GITHUB_SHA}" \
                 --build-arg REOWN_PROJECT_ID="${REOWN_PROJECT_ID}" 2>&1 | tee /tmp/fly-build.log; then
              echo "  built and pushed ${IMAGE}"
              echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  attempt ${attempt} failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error title=fly build failed after 3 attempts::$(tail -c 3000 /tmp/fly-build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          exit 1

  deploy:
    name: fly deploy (${{ matrix.network }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    # No build happens here any more — just the rolling release, its bounded
    # --wait-timeout (10m), the smoke check and the sync gate.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # No max-parallel. The legs pull one already-built image ref and never
      # touch a builder, so they cannot contend.
      #
      # (Historical note: 933719f added `max-parallel: 1` on the theory that
      # three identical parallel builds contend on Fly's shared builder. Run
      # 33355471009 was the first run with that serialization and disproved it —
      # the coston2 leg ran FIRST and ALONE and still failed, on depot builder
      # unavailability. Serialization cost ~20 minutes of wall clock and fixed
      # nothing. The build job above addresses the actual failure.)
      matrix:
        network: ${{ fromJson(needs.plan.outputs.networks) }}
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
      - name: Install flyctl
        # flyctl is a single static binary served over HTTPS from Fly's CDN.
        # The install is verified rather than assumed: `curl | sh` reports
        # success even when the binary is only partially written.
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.fly/bin/"* 2>/dev/null || true
          if ! "$HOME/.fly/bin/flyctl" version; then
            echo "::error title=flyctl install failed::flyctl is not executable after install.sh"
            exit 1
          fi
      - name: Validate deployments/ (source of truth)
        run: bash tools/check-deployments.sh
      - name: Generate fly.toml from template + deployments/${{ matrix.network }}.json
        # fly.toml is gitignored. It is generated from the public per-network
        # template by replacing CHANGE_ME_* placeholders with values from the
        # committed deployment record. Null addresses (status: not-deployed)
        # become empty strings, which the backend treats as read-only mode.
        env:
          NETWORK: ${{ matrix.network }}
          WC_PROJECT_ID: ${{ secrets.WC_PROJECT_ID }}
        run: |
          set -euo pipefail
          DEP="deployments/${NETWORK}.json"
          TEMPLATE="fly.${NETWORK}.toml.example"
          [ -f "$DEP" ] || { echo "::error::no $DEP"; exit 1; }
          [ -f "$TEMPLATE" ] || { echo "::error::no $TEMPLATE"; exit 1; }
          [ -n "${WC_PROJECT_ID:-}" ] || { echo "::error::secret WC_PROJECT_ID is not set"; exit 1; }
          j() { jq -r "$1 // empty" "$DEP"; }
          STATUS=$(j .status)
          MARKETPLACE_ADDR=$(j .contracts.marketplace)
          AUCTION_ADDR=$(j .contracts.auctionHouse)
          OFFERBOOK_ADDR=$(j .contracts.offerBook)
          NFT_ADDR=$(j .contracts.nft)
          MARKETPLACE_MANAGER_ADDR=$(j .contracts.marketplaceManager)
          TRACKED_COLLECTIONS=$(jq -r '(.trackedCollections // []) | join(",")' "$DEP")
          INDEX_FROM_BLOCK=$(j .indexFromBlock)
          # read-only networks are real origins (browse/wallet/profile) and must
          # appear in every sibling's switcher; only not-deployed stays hidden.
          NETWORK_URLS=$(jq -r '[inputs | select(.status=="deployed" or .status=="read-only") | "\(.chainId)=\(.app.origin)"] | join(",")' -n deployments/coston2.json deployments/songbird.json deployments/flare.json)
          # NETWORK_TRADING tells each app whether its siblings trade
          # ("deployed" → live) or only browse ("read-only" → browse-only);
          # a process cannot see another network's contracts. Same shape as
          # NETWORK_URLS; read by config.buildNetworks.
          NETWORK_TRADING=$(jq -r '[inputs | select(.status=="deployed" or .status=="read-only") | "\(.chainId)=\(if .status=="deployed" then "live" else "browse-only" end)"] | join(",")' -n deployments/coston2.json deployments/songbird.json deployments/flare.json)
          if [ "$STATUS" = "deployed" ]; then
            for v in MARKETPLACE_ADDR AUCTION_ADDR OFFERBOOK_ADDR NFT_ADDR MARKETPLACE_MANAGER_ADDR INDEX_FROM_BLOCK; do
              [ -n "${!v}" ] || { echo "::error::$DEP is 'deployed' but $v is empty"; exit 1; }
            done
          else
            echo "::notice::${NETWORK} has no contracts (status=$STATUS) — deploying in read-only network mode"
            INDEX_FROM_BLOCK=0
          fi
          cp "$TEMPLATE" fly.toml
          for key in MARKETPLACE_ADDR AUCTION_ADDR OFFERBOOK_ADDR NFT_ADDR MARKETPLACE_MANAGER_ADDR TRACKED_COLLECTIONS INDEX_FROM_BLOCK WC_PROJECT_ID; do
            sed -i "s|CHANGE_ME_${key}|${!key}|g" fly.toml
          done
          # NETWORK_URLS lists every deployed sibling so the switcher and the
          # wrong-network banner can link to them. Inserted into [env] right
          # after HTTP_ADDR (templates keep it out so forks do not advertise
          # apps that may not exist).
          sed -i "s|^  HTTP_ADDR = \":8080\"|  HTTP_ADDR = \":8080\"\n  NETWORK_URLS = \"${NETWORK_URLS}\"\n  NETWORK_TRADING = \"${NETWORK_TRADING}\"|" fly.toml
          UNRESOLVED=$(grep -v '^[[:space:]]*#' fly.toml | grep -o 'CHANGE_ME_[A-Z_]*' | sort -u | xargs || true)
          if [ -n "$UNRESOLVED" ]; then echo "::error::unresolved placeholders in fly.toml: ${UNRESOLVED}"; exit 1; fi
          echo "  generated fly.toml for ${NETWORK} (app $(jq -r .app.flyApp "$DEP"), status ${STATUS})"
          grep -E '^\s*(app|CHAIN_ID|MARKETPLACE_ADDR|NETWORK_URLS|NETWORK_TRADING)\s*=' fly.toml
      - name: Deploy image (rolling release)
        id: fly_deploy
        # No build happens here: the image was built once by the `build` job and
        # this leg only rolls it out. That removes the failure this step used to
        # have to contain — a remote build stalling inside the builder, which
        # --wait-timeout does not bound because it covers only the RELEASE wait.
        # With build gone, the step bound only needs to cover that release wait
        # plus the image pull.
        timeout-minutes: 15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -o pipefail
          [ -n "${IMAGE:-}" ] || { echo "::error::build job produced no image ref"; exit 1; }
          echo "  deploying $IMAGE (commit $GITHUB_SHA) to ${{ matrix.network }}"
          # --wait-timeout bounds the release wait. Without it fly can sit on a
          # rolling release until the JOB timeout kills it mid-deploy, and the
          # always() sync gate below then reports DRIFT against a half-deployed
          # app — which reads as a deploy-integrity failure when the real cause
          # is "the deploy never finished". A bounded wait fails with fly's own
          # diagnostics instead.
          if fly deploy --image "$IMAGE" --strategy rolling --wait-timeout 600 2>&1 | tee /tmp/fly-deploy.log; then
            exit 0
          fi
          echo "::error title=fly deploy failed (${{ matrix.network }})::$(tail -c 3000 /tmp/fly-deploy.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          exit 1
      - name: Post-deploy smoke check (/readyz)
        if: success()
        run: |
          # rolling keeps the old machine serving until the new one passes its
          # health check; 30s covers the swap on a single-machine app.
          sleep 30
          ORIGIN=$(jq -r .app.origin "deployments/${{ matrix.network }}.json")
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors "$ORIGIN/readyz"
      - name: Post-deploy sync gate (origin/main SHA == live X-MW-Build-SHA)
        # Runs in every terminal state so a broken binary and a stale-SHA
        # deploy both surface loudly (see tools/check-fly-sync.sh).
        if: always()
        run: |
          # Say up front whether the deploy step actually succeeded. When it did
          # not, a stale SHA below means "the deploy never landed", NOT that a
          # good deploy served the wrong binary — two very different incidents
          # that this gate's DRIFT output otherwise reports identically.
          if [ "${{ steps.fly_deploy.outcome }}" != "success" ]; then
            echo "::warning title=deploy did not succeed (${{ matrix.network }})::The deploy step outcome was '${{ steps.fly_deploy.outcome }}'. Any DRIFT reported below is expected — this network was never updated. Fix the deploy failure first."
          fi
          LIVE_URL=$(jq -r .app.origin "deployments/${{ matrix.network }}.json" | tr -d '\r') ./tools/check-fly-sync.sh
