apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Coston2 testnet — the live trading network. Addresses mirror
# deployments/coston2.json (the single source of truth); keep them in sync.
namespace: magicwebb-coston2
nameSuffix: -coston2

resources:
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: mw-config
    behavior: merge
    literals:
      - CHAIN_ID=114
      - RPC_URL=https://coston2-api.flare.network/ext/C/rpc
      - RPC_URLS=https://coston2-api.flare.network/ext/C/rpc,https://coston2.enosys.global/ext/C/rpc,https://rpc.ankr.com/flare_coston2
      # CHANGE_ME: these three must match the Ingress hosts of your k8s
      # releases (SIWE binds sessions to the domain; NETWORK_URLS drives the
      # network switcher). Fly origins here would send users off-cluster.
      - SIWE_DOMAIN=coston2.magicwebb.example
      - FRONTEND_URL=https://coston2.magicwebb.example
      - NETWORK_URLS=114=https://coston2.magicwebb.example,19=https://songbird.magicwebb.example,14=https://flare.magicwebb.example
      - MARKETPLACE_ADDR=0x74abb995ffcf8f1f8cc5170d19dda3705a2640a9
      - AUCTION_ADDR=0x102849c42aefa93d52757a19f57398125242fd02
      - OFFERBOOK_ADDR=0xf58a8ff08fd33af4969617dd97495a0ab770b4af
      - NFT_ADDR=0x832d74cfbb4617b50c32cd110dfe16837a359b35
      - MARKETPLACE_MANAGER_ADDR=0xbf55a1d9e5c87a6a30414503eb84974971cbbe2f
      - TRACKED_COLLECTIONS=0x832d74cfbb4617b50c32cd110dfe16837a359b35
      - INDEX_FROM_BLOCK=34619862
      # Testnet convenience: contract-address change wipes chain-derived tables
      # at boot. Mainnet overlays leave this unset (manual chainwipe).
      - RESET_ON_ADDRESS_CHANGE=true
