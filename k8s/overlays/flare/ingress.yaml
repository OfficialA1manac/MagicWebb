apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magicwebb
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: flare.magicwebb.example # CHANGE_ME: your DNS name for this network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magicwebb-flare
                port:
                  name: http
