apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One MagicWebb release per chain. This base is chain-agnostic; each overlay
# (coston2 / songbird / flare) supplies CHAIN_ID, RPC endpoints, contract
# addresses, and its OWN database/redis secrets. Never point two overlays at
# the same Neon project or Redis instance.
resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: mw-config
    literals:
      - ENV=production
      - HTTP_ADDR=:8080
      # ~80% of the container memory limit: GC works harder near the cap
      # instead of the kubelet OOM-killing the process.
      - GOMEMLIMIT=400MiB

# Image pinning: CI mirrors every green build to
# ghcr.io/officiala1manac/magicwebb:sha-<sha> (deploy.yml "Mirror image to
# GHCR"). Pin a rollout to an exact build with:
#   cd k8s/base && kustomize edit set image ghcr.io/officiala1manac/magicwebb:sha-<sha>
# (or override per-overlay with the same `images:` stanza there).
# "latest" here is only a placeholder so the manifest renders out of the box —
# never run production on :latest.
images:
  - name: ghcr.io/officiala1manac/magicwebb
    newTag: latest
